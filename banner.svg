<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Adrian Costa — Produto, código e território.</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- textura sutil -->
  <g fill="#8B949E" opacity="0.35">
    <circle cx="60" cy="40" r="1"/>
    <circle cx="150" cy="250" r="1"/>
    <circle cx="1140" cy="45" r="1"/>
    <circle cx="1080" cy="260" r="1"/>
    <circle cx="500" cy="30" r="1"/>
    <circle cx="700" cy="270" r="1"/>
  </g>

  <!-- esquerda: curvas de nivel (territorio) -->
  <g fill="none" stroke="#8B949E" stroke-width="1.2" opacity="0.5">
    <path d="M-20,90 C90,64 180,118 280,96 C330,85 355,102 380,96"/>
    <path d="M-20,132 C100,110 190,150 280,132 C330,122 355,138 380,132"/>
    <path d="M-20,174 C110,156 195,188 280,170 C330,160 355,176 380,170"/>
  </g>
  <g fill="none" stroke="#F0F6FC" stroke-width="1.3" opacity="0.8">
    <path d="M-20,212 C120,192 200,224 285,206 C335,196 358,210 380,206"/>
  </g>
  <g fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="1 5" opacity="0.4">
    <path d="M-20,68 C95,44 175,90 280,70"/>
  </g>
  <circle cx="230" cy="150" r="8" fill="none" stroke="#16A34A" stroke-width="1" opacity="0.5"/>
  <circle cx="230" cy="150" r="4" fill="#16A34A"/>
  <line x1="230" y1="128" x2="230" y2="172" stroke="#16A34A" stroke-width="1"/>
  <line x1="208" y1="150" x2="252" y2="150" stroke="#16A34A" stroke-width="1"/>

  <!-- direita: grid de circuito (sistema) -->
  <g fill="none" stroke="#8B949E" stroke-width="1.2" opacity="0.55">
    <path d="M840,70 h70 v40 h60 v30"/>
    <path d="M845,150 h50 v55 h95"/>
    <path d="M1010,80 v70 h70"/>
    <path d="M960,220 h-40 v-40"/>
  </g>
  <circle cx="910" cy="110" r="3.2" fill="#F0F6FC"/>
  <circle cx="895" cy="205" r="3.2" fill="#F0F6FC"/>
  <circle cx="1080" cy="150" r="8" fill="none" stroke="#16A34A" stroke-width="1" opacity="0.5"/>
  <circle cx="1080" cy="150" r="4.4" fill="#16A34A"/>
  <line x1="1080" y1="130" x2="1080" y2="170" stroke="#16A34A" stroke-width="1"/>
  <line x1="1060" y1="150" x2="1100" y2="150" stroke="#16A34A" stroke-width="1"/>

  <!-- nome e assinatura -->
  <text x="600" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="2" fill="#F0F6FC">ADRIAN COSTA</text>
  <line x1="520" y1="156" x2="680" y2="156" stroke="#16A34A" stroke-width="1.5"/>
  <text x="600" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="0.3" fill="#8B949E">Produto, código e território.</text>
</svg>
